services:
  - type: web
    name: cowork-whatsapp-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CRM_API
        sync: false
      - key: SARVAM_API
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: PUBLIC_URL
        value: "https://cowork-whatsapp-bot.onrender.com"
